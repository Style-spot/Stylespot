<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StyleSpot Barber Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0b0d;
  color:#eee;
  font-family:Arial,system-ui,sans-serif;
}

.nav{
  height:74px;
  padding:0 6%;
  display:flex;
  align-items:center;
  border-bottom:1px solid #29292f;
}

.brand{
  font-weight:800;
  font-size:20px;
  margin-right:auto;
}

.brand span{
  color:#d8aa60;
}

.nav a{
  color:#ddd;
  text-decoration:none;
}

.dash{
  max-width:1150px;
  margin:auto;
  padding:60px 6%;
}

.ey{
  font-size:12px;
  letter-spacing:2px;
  color:#d8aa60;
  font-weight:800;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.head h1{
  font:600 48px Georgia,serif;
  margin:8px 0;
}

.muted{
  color:#999;
}

.btn{
  padding:12px 18px;
  border:0;
  border-radius:9px;
  background:#d8aa60;
  font-weight:800;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin:28px 0;
}

.stats div{
  background:#151519;
  border:1px solid #2b2b31;
  border-radius:14px;
  padding:20px;
}

.stats b{
  display:block;
  font-size:30px;
  color:#d8aa60;
}

.stats span{
  color:#999;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

input,select{
  width:100%;
  padding:13px;
  background:#0d0d10;
  color:#eee;
  border:1px solid #36363d;
  border-radius:9px;
  margin-top:6px;
}

.appointment{
  display:grid;
  grid-template-columns:140px 1fr 180px;
  gap:20px;
  align-items:center;
  padding:20px;
  margin:10px 0;
  background:#151519;
  border:1px solid #2b2b31;
  border-radius:14px;
}

.time{
  color:#d8aa60;
  font-weight:800;
}

.time small{
  display:block;
  color:#777;
  margin-top:4px;
}

.appointment h3{
  margin:0;
}

.appointment p{
  color:#bbb;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.action{
  width:100%;
  padding:10px;
  border:0;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

.confirm{
  background:#d8aa60;
  color:#111;
}

.reject{
  background:#29292f;
  color:#ffb1a8;
  border:1px solid #4a3030;
}

.complete{
  background:#263b2b;
  color:#cdebd2;
}

.cancel{
  background:#29292f;
  color:#ddd;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.pending{
  background:#3a301f;
  color:#d8aa60;
}

.confirmed{
  background:#203725;
  color:#bfe8c6;
}

.completed{
  background:#263d45;
  color:#bde4ef;
}

.cancelled,.rejected{
  background:#3b2525;
  color:#ffb1a8;
}

.empty{
  text-align:center;
  padding:40px;
  color:#888;
  border:1px dashed #333;
}

@media(max-width:700px){
  .appointment,
  .filters{
    grid-template-columns:1fr;
  }

  .head{
    align-items:start;
    gap:15px;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<nav class="nav">
  <div class="brand">STYLE<span>SPOT</span> BARBER</div>
  <a href="customer.html">Customer Website ↗</a>
</nav>

<main class="dash">

  <div class="head">
    <div>
      <div class="ey">PRIVATE SALON DASHBOARD</div>
      <h1>Appointments</h1>
      <p class="muted">
        Customer booking requests appear here.
      </p>
    </div>

    <button class="btn" onclick="load()">
      Refresh
    </button>
  </div>

  <div id="stats" class="stats"></div>

  <div class="filters">
    <label>
      Date
      <input id="date" type="date">
    </label>

    <label>
      Status
      <select id="status">
        <option value="">All</option>
        <option>Pending</option>
        <option>Confirmed</option>
        <option>Completed</option>
        <option>Cancelled</option>
        <option>Rejected</option>
      </select>
    </label>
  </div>

  <div id="list"></div>

</main>

<script>

const $ = id => document.getElementById(id);


/* BARBER LOGIN */

async function barberLogin(){

  const phone =
    prompt("Enter barber phone number:");

  if(!phone){
    return;
  }

  const password =
    prompt("Enter barber password:");

  if(!password){
    return;
  }

  try{

    const response =
      await fetch(
        "/api/barber/login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            phone:phone,
            password:password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        data.error ||
        "Barber login failed"
      );

      return;
    }

    localStorage.setItem(
      "barberToken",
      data.token
    );

    alert(
      "Barber login successful!"
    );

    load();

  }catch(error){

    console.error(error);

    alert(
      "Could not connect to server."
    );

  }

}


/* BARBER TOKEN */

function getToken(){

  return (
    localStorage.getItem("barberToken") ||
    sessionStorage.getItem("barberToken") ||
    ""
  );

}


/* DATE */

let d = new Date();

d.setMinutes(
  d.getMinutes() -
  d.getTimezoneOffset()
);

$("date").value =
  d.toISOString().slice(0,10);


/* LOAD APPOINTMENTS */

async function load(){

  try{

    const token = getToken();

    if(!token){

      $("list").innerHTML =
        "<div class='empty'>Barber login required. Please login again.</div>";

      return;
    }

    const response =
      await fetch(
        "/api/barber/bookings",
        {
          headers:{
            "Authorization":"Bearer "+token
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Could not load appointments"
      );

    }

    const all =
      data.bookings;

    if(!Array.isArray(all)){

      throw new Error(
        "Invalid booking data"
      );

    }

    const selectedDate =
      $("date").value;

    const selectedStatus =
      $("status").value;

    const bookings =
      all.filter(x => {

        const dateMatch =
          !selectedDate ||
          String(x.date).slice(0,10) === selectedDate;

        const statusMatch =
          !selectedStatus ||
          x.status === selectedStatus;

        return dateMatch && statusMatch;

      });


    const statuses = [
      "Pending",
      "Confirmed",
      "Completed",
      "Cancelled"
    ];


    $("stats").innerHTML =
      statuses.map(status => {

        const count =
          bookings.filter(
            x => x.status === status
          ).length;

        return `
          <div>
            <b>${count}</b>
            <span>${status}</span>
          </div>
        `;

      }).join("");


    if(!bookings.length){

      $("list").innerHTML =
        "<div class='empty'>No appointments.</div>";

      return;
    }


    $("list").innerHTML =
      bookings.map(x => {

        const status =
          x.status || "Pending";

        let buttons = "";


        if(status === "Pending"){

          buttons = `
            <button
              class="action confirm"
              onclick="changeStatus('${x.id}','Confirmed')">
              ✓ Accept Booking
            </button>

            <button
              class="action reject"
              onclick="changeStatus('${x.id}','Rejected')">
              ✕ Reject Booking
            </button>
          `;

        }


        else if(status === "Confirmed"){

          buttons = `
            <button
              class="action complete"
              onclick="changeStatus('${x.id}','Completed')">
              ✓ Mark Completed
            </button>

            <button
              class="action cancel"
              onclick="changeStatus('${x.id}','Cancelled')">
              Cancel
            </button>
          `;

        }


        else if(status === "Completed"){

          buttons = `
            <div class="muted">
              Appointment completed
            </div>
          `;

        }


        else if(
          status === "Cancelled" ||
          status === "Rejected"
        ){

          buttons = `
            <div class="muted">
              ${status}
            </div>
          `;

        }


        return `
          <article class="appointment">

            <div class="time">
              ${x.time}
              <small>${x.booking_no}</small>
            </div>

            <div>

              <h3>${escapeHtml(x.name)}</h3>

              <p>
                ${escapeHtml(x.service)}
              </p>

              <small>
                📞 ${escapeHtml(x.phone)}
                ${
                  x.notes
                    ? " • 📝 " +
                      escapeHtml(x.notes)
                    : ""
                }
              </small>

              <br>

              <span class="status ${status.toLowerCase()}">
                ${status}
              </span>

            </div>

            <div class="actions">
              ${buttons}
            </div>

          </article>
        `;

      }).join("");

  }

  catch(error){

    console.error(error);

    $("list").innerHTML =
      "<div class='empty'>Could not load appointments. Please refresh.</div>";

  }

}


/* CHANGE BOOKING STATUS */

async function changeStatus(id,status){

  try{

    const token = getToken();

    if(!token){

      alert(
        "Barber login required. Please login again."
      );

      return;
    }


    let endpoint;


    if(status === "Confirmed"){

      endpoint =
        "/api/barber/bookings/" +
        id +
        "/accept";

    }
    else if(status === "Rejected"){

      endpoint =
        "/api/barber/bookings/" +
        id +
        "/reject";

    }
    else if(status === "Completed"){

      endpoint =
        "/api/barber/bookings/" +
        id +
        "/complete";

    }
    else if(status === "Cancelled"){

      endpoint =
        "/api/barber/bookings/" +
        id +
        "/cancel";

    }
    else{

      alert("Invalid booking status.");

      return;
    }


    const response =
      await fetch(
        endpoint,
        {
          method:"PATCH",
          headers:{
            "Authorization":"Bearer "+token,
            "Content-Type":"application/json"
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.error ||
        "Could not update booking."
      );

      return;
    }


    await load();

  }

  catch(error){

    console.error(error);

    alert(
      "Could not connect to server."
    );

  }

}


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* FILTERS + AUTO REFRESH */

$("date").onchange = load;

$("status").onchange = load;

load();

setInterval(
  load,
  15000
);

</script>

</body>
</html>
